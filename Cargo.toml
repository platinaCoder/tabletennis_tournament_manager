[package]
name = "tabletennis_tournament"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "query"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cookie = "0.18"
getrandom = "0.3"
http = "1"
openid = { version = "0.23.0", default-features = false, features = ["rustls"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { package = "sqlx-core", version = "=0.8.6", default-features = false, features = [
    "_rt-tokio",
    "_tls-rustls-ring-webpki",
    "chrono",
    "json",
    "migrate",
    "uuid",
] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = [
    "chrono",
    "json",
    "migrate",
    "uuid",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Performance", "Window"] }

[workspace]
members = ["gui"]
resolver = "3"

[[bin]]
name = "vercel-api"
path = "api/server.rs"
