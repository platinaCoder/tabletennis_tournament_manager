[package]
name = "tabletennis_tournament"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Performance", "Window"] }

[workspace]
members = ["gui"]
resolver = "3"
