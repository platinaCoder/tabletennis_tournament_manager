[package]
name = "tabletennis_tournament_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
js-sys = "0.3"
serde = "1"
serde_json = "1"
tabletennis_tournament = { path = ".." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Location",
    "Storage",
    "Url",
    "Window",
] }
yew = { version = "0.23", features = ["csr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
